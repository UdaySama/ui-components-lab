<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Disco Background Toggle</title>
  </head>
  <body>
    <button id="discoBtn">Start</button>
    <script>
      let intervalId = null;
      const discoBtn = document.getElementById("discoBtn");
      function getRandomColor() {
        const letters = "0123456789ABCDEFIJKLMNOP";
        let color = "#";
        for (let i = 0; i < 6; i++) {
          color += letters[Math.floor(Math.random() * 16)];
        }
        return color;
      }
      discoBtn.addEventListener("click", function () {
        if (intervalId === null) {
          intervalId = setInterval(function () {
            document.body.style.backgroundColor = getRandomColor();
          }, 200);
          discoBtn.textContent = 'Stop Disco'
        }else{
           clearInterval(intervalId);
           intervalId = null 
           document.body.style.backgroundColor = ''
           discoBtn.textContent = 'Start Disco'
        }
      });
    </script>
  </body>
</html>
